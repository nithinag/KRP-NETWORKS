          <path d="M680 1440 L820 1490 L990 1510 L1170 1500 L1320 1470 L1410 1510 L1320 1560 L1110 1585 L910 1570 L760 1530 Z"/>
        </g>

        <g id="continent-dots-secondary" fill="url(#dotPatternFine)" opacity="0.62" transform="translate(4 3)">
          <path d="M590 760 L650 690 L760 650 L860 690 L900 770 L860 835 L790 860 L730 900 L650 890 L580 840 Z"/>
          <path d="M760 925 L700 980 L670 1060 L690 1160 L740 1270 L810 1370 L860 1410 L890 1360 L880 1280 L850 1190 L820 1110 L810 1030 Z"/>
          <path d="M930 700 L1000 650 L1090 660 L1160 700 L1200 770 L1180 860 L1130 920 L1070 980 L1035 1060 L1045 1160 L1010 1240 L940 1270 L890 1210 L860 1130 L860 1040 L900 960 L930 890 L910 820 Z"/>
          <path d="M1110 700 L1220 660 L1340 690 L1440 770 L1480 860 L1460 940 L1390 1000 L1300 1010 L1230 970 L1180 900 L1160 820 Z"/>
