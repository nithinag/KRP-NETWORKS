    <g id="glass-layer" clip-path="url(#globeClip)">
      <circle cx="1024" cy="1024" r="620" fill="url(#glassSweepGradient)" opacity="0.42"/>
      <ellipse cx="1270" cy="760" rx="470" ry="330" fill="url(#glassSpecularGradient)" opacity="0.7"/>
      <path d="M600 1180 C760 1040 1080 1020 1420 1160 L1420 1650 L600 1650 Z" fill="#041A4A" opacity="0.14"/>
      <path d="M710 860 C820 680 1040 620 1280 720" stroke="#D9FFFF" stroke-opacity="0.34" stroke-width="2.2" fill="none"/>
    </g>

    <g id="lighting-layer" clip-path="url(#globeClip)">
      <circle cx="1290" cy="760" r="390" fill="url(#upperRightLightGradient)"/>
      <circle cx="810" cy="1290" r="520" fill="url(#lowerLeftShadeGradient)"/>
    </g>
  </g>

  <g id="orbit-lines" fill="none" stroke-linecap="round">
    <ellipse cx="1024" cy="1024" rx="705" ry="655" transform="rotate(-8 1024 1024)" stroke="#8CE8FF" stroke-opacity="0.22" stroke-width="1.45"/>
    <ellipse cx="1024" cy="1024" rx="735" ry="590" transform="rotate(18 1024 1024)" stroke="#8BC4FF" stroke-opacity="0.2" stroke-width="1.35"/>
  </g>

