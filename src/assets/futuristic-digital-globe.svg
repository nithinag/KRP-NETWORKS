<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048" role="img" aria-labelledby="title desc">
  <title id="title">Futuristic Digital Globe</title>
  <desc id="desc">A high-resolution futuristic dotted world globe with network connections, glass depth effects, and orbiting particles over a deep blue gradient background.</desc>

  <defs>
    <linearGradient id="bgGradient" x1="1024" y1="0" x2="1024" y2="2048" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04112C"/>
      <stop offset="0.55" stop-color="#041538"/>
      <stop offset="1" stop-color="#010916"/>
    </linearGradient>

    <radialGradient id="bgCenterBloom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1060 1020) rotate(90) scale(980 1180)">
      <stop offset="0" stop-color="#113D85" stop-opacity="0.52"/>
      <stop offset="0.52" stop-color="#0A2864" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#051235" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1024 1024) rotate(90) scale(1240)">
      <stop offset="0.58" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>

    <radialGradient id="globalAura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1024 1024) rotate(90) scale(860)">
      <stop offset="0" stop-color="#3BDFFF" stop-opacity="0.52"/>
      <stop offset="0.56" stop-color="#208BD9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0C2A6F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="globeSurfaceGradient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 860) rotate(42) scale(1050 980)">
      <stop offset="0" stop-color="#57F1FF"/>
      <stop offset="0.35" stop-color="#1CA8F0"/>
      <stop offset="0.7" stop-color="#0E5CB8"/>
      <stop offset="1" stop-color="#0A2F79"/>
    </radialGradient>

    <radialGradient id="globeDepthGradient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(840 1180) rotate(8) scale(860 760)">
      <stop offset="0" stop-color="#071E53" stop-opacity="0"/>
      <stop offset="0.68" stop-color="#041339" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#01091C" stop-opacity="0.85"/>
    </radialGradient>

    <radialGradient id="innerGlowGradient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1024 1024) rotate(90) scale(640)">
      <stop offset="0" stop-color="#64FBFF" stop-opacity="0.32"/>
      <stop offset="0.72" stop-color="#1D90D8" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#1D90D8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimLightGradient" x1="530" y1="470" x2="1530" y2="1530" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A2FFFF" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#56CFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7FD8FF" stop-opacity="0.66"/>
    </linearGradient>

    <linearGradient id="gridStrokeGradient" x1="430" y1="560" x2="1640" y2="1490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BDFEFF" stop-opacity="0.48"/>
      <stop offset="0.55" stop-color="#6FD9FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#82D4FF" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="networkLineGradient" x1="590" y1="640" x2="1450" y2="1340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A4FFFF" stop-opacity="0.74"/>
      <stop offset="0.48" stop-color="#63E4FF" stop-opacity="0.66"/>
      <stop offset="1" stop-color="#8AB8FF" stop-opacity="0.58"/>
    </linearGradient>

    <radialGradient id="glassSpecularGradient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1270 760) rotate(34) scale(470 330)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#CAFAFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#CAFAFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassSweepGradient" x1="640" y1="640" x2="1390" y2="1420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D6FEFF" stop-opacity="0.24"/>
      <stop offset="0.45" stop-color="#A2EEFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#6EC7FF" stop-opacity="0.22"/>
    </linearGradient>

    <radialGradient id="upperRightLightGradient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1290 760) rotate(90) scale(390)">
      <stop offset="0" stop-color="#D9FDFF" stop-opacity="0.32"/>
      <stop offset="0.66" stop-color="#7ADFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#7ADFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lowerLeftShadeGradient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(810 1290) rotate(90) scale(520)">
      <stop offset="0" stop-color="#021233" stop-opacity="0.38"/>
      <stop offset="0.76" stop-color="#010A1F" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#010A1F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sphereVolumeGradient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 900) rotate(35) scale(780 730)">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.68" stop-color="#D5D5D5"/>
      <stop offset="1" stop-color="#4A4A4A"/>
    </radialGradient>

    <radialGradient id="continentMaskGradient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1090 930) rotate(35) scale(730 690)">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#EBEBEB"/>
      <stop offset="1" stop-color="#6C6C6C"/>
    </radialGradient>

    <pattern id="dotPatternLarge" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.4" r="1.05" fill="#A6FFFF"/>
      <circle cx="5.1" cy="2.8" r="0.95" fill="#67EDFF"/>
      <circle cx="2.8" cy="6.2" r="0.86" fill="#4AD8FF" fill-opacity="0.9"/>
      <circle cx="6.7" cy="6.6" r="0.66" fill="#D2FFFF" fill-opacity="0.68"/>
    </pattern>

    <pattern id="dotPatternFine" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.72" fill="#A9FFFF"/>
      <circle cx="4.1" cy="2.5" r="0.65" fill="#65E8FF" fill-opacity="0.95"/>
      <circle cx="2.9" cy="4.9" r="0.58" fill="#5FD6FF" fill-opacity="0.84"/>
    </pattern>

    <clipPath id="globeClip">
      <circle cx="1024" cy="1024" r="620"/>
    </clipPath>

    <mask id="sphereVolumeMask">
      <rect width="2048" height="2048" fill="#000000"/>
      <circle cx="1024" cy="1024" r="620" fill="url(#sphereVolumeGradient)"/>
    </mask>

    <mask id="continentMask">
      <rect width="2048" height="2048" fill="#000000"/>
      <circle cx="1024" cy="1024" r="620" fill="url(#continentMaskGradient)"/>
    </mask>

    <filter id="wideBlur" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="74"/>
    </filter>

    <filter id="haloBlur" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>

    <filter id="rimBlur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>

    <filter id="dotGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.35" result="dotBlur"/>
      <feMerge>
        <feMergeNode in="dotBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="4.3" flood-color="#79F8FF" flood-opacity="0.92"/>
    </filter>

    <filter id="particleGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#8BF7FF" flood-opacity="0.95"/>
    </filter>
  </defs>

  <g id="background">
    <rect width="2048" height="2048" fill="url(#bgGradient)"/>
    <rect width="2048" height="2048" fill="url(#bgCenterBloom)"/>
    <rect width="2048" height="2048" fill="url(#vignette)"/>
  </g>

  <g id="center-light">
    <circle cx="1024" cy="1024" r="830" fill="url(#globalAura)" filter="url(#wideBlur)" opacity="0.68"/>
  </g>

  <g id="globe">
    <g id="outer-rim-light">
      <circle cx="1024" cy="1024" r="676" fill="#2ABEFF" opacity="0.16" filter="url(#haloBlur)"/>
      <circle cx="1024" cy="1024" r="624" stroke="url(#rimLightGradient)" stroke-width="8" fill="none" opacity="0.82" filter="url(#rimBlur)"/>
    </g>

    <g id="globe-base">
      <circle cx="1024" cy="1024" r="620" fill="url(#globeSurfaceGradient)"/>
      <circle cx="1024" cy="1024" r="620" fill="url(#globeDepthGradient)"/>
      <circle cx="1024" cy="1024" r="620" fill="url(#innerGlowGradient)"/>
    </g>

    <g id="surface-details" clip-path="url(#globeClip)" mask="url(#sphereVolumeMask)">
      <g id="continent-dot-layer" mask="url(#continentMask)" filter="url(#dotGlow)" opacity="0.96">
        <g id="continent-dots-primary" fill="url(#dotPatternLarge)">
          <path d="M590 760 L650 690 L760 650 L860 690 L900 770 L860 835 L790 860 L730 900 L650 890 L580 840 Z"/>
