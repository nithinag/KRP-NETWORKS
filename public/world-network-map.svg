<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-linejoin="round">
  <!-- World map outline + network grid - telecom/fiber aesthetic -->
  <!-- North America -->
  <path d="M 180,120 L 380,100 L 520,140 L 560,200 L 540,280 L 500,360 L 460,420 L 400,480 L 320,520 L 220,500 L 140,440 L 100,360 L 100,260 L 130,180 Z"/>
  <!-- South America -->
  <path d="M 520,420 L 580,380 L 640,400 L 680,460 L 700,540 L 680,620 L 620,680 L 540,700 L 480,680 L 440,600 L 440,520 L 480,450 Z"/>
  <!-- Europe -->
  <path d="M 920,100 L 1000,80 L 1080,120 L 1120,180 L 1120,260 L 1080,320 L 1020,360 L 960,380 L 900,360 L 860,300 L 860,220 L 900,160 Z"/>
  <!-- Africa -->
  <path d="M 960,340 L 1020,320 L 1080,360 L 1120,440 L 1120,540 L 1080,620 L 1020,680 L 960,700 L 920,660 L 920,560 L 940,460 Z"/>
  <!-- Asia -->
  <path d="M 1080,120 L 1180,100 L 1300,140 L 1420,200 L 1520,280 L 1580,380 L 1600,500 L 1580,620 L 1520,720 L 1420,780 L 1280,800 L 1140,780 L 1040,720 L 1000,620 L 1000,500 L 1020,380 L 1040,260 Z"/>
  <!-- Australia -->
  <path d="M 1520,680 L 1600,660 L 1680,700 L 1740,760 L 1760,840 L 1720,900 L 1640,940 L 1560,920 L 1500,860 L 1480,780 Z"/>
  <!-- Network connection lines -->
  <line x1="400" y1="280" x2="920" y2="220" opacity="0.2"/>
  <line x1="920" y1="220" x2="1080" y2="360" opacity="0.2"/>
  <line x1="640" y1="520" x2="920" y2="460" opacity="0.2"/>
  <line x1="1080" y1="360" x2="1300" y2="500" opacity="0.2"/>
  <line x1="1300" y1="500" x2="1640" y2="780" opacity="0.2"/>
</svg>
